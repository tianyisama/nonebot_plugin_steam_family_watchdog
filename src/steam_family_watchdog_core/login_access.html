<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steam 认证页</title>
<style>:root{color-scheme:dark}body{font:16px system-ui;background:#111827;color:#e5e7eb;margin:0;padding:36px 16px}main{max-width:480px;margin:auto;padding:28px;background:#1f2937;border:1px solid #374151;border-radius:18px}h1{font-size:25px}p{line-height:1.7;color:#bdc9da}label{display:block;margin:18px 0 8px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:8px}input{background:#111827;color:white;border:1px solid #59677a}button{margin-top:20px;background:#38bdf8;color:#082f49;border:0;font-weight:600;cursor:pointer}#status{white-space:pre-wrap;color:#a5e7ff}</style>
<main><h1>Steam 认证页</h1><p>请先使用管理密钥打开登录表单。密钥为配置中的 WEB_TOKEN，或数据目录 web-token.txt 的内容。</p><form id="unlock"><label for="key">管理密钥</label><input id="key" type="password" autocomplete="off" required><button>打开认证页</button></form><p id="status" role="status"></p></main>
<script>document.getElementById('unlock').onsubmit=async event=>{event.preventDefault();const input=document.getElementById('key'),token=input.value;input.value='';try{const response=await fetch('page',{headers:{Authorization:`Bearer ${token}`}});if(!response.ok){document.getElementById('status').textContent='管理密钥不正确，或本次认证窗口已经关闭。';return;}const page=await response.text();document.open();document.write(page);document.close();}catch{document.getElementById('status').textContent='认证服务未连接，请发送 steam认证 重新打开。';}};</script></html>
