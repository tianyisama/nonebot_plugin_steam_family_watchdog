<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steam 家庭库管理</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101821;color:#e6edf4;font:15px system-ui,sans-serif;line-height:1.6}main{max-width:1020px;margin:36px auto;padding:0 20px}h1{font-size:28px;margin-bottom:4px}h2{font-size:19px;margin:0 0 16px}.muted{color:#a9b7c7}section{padding:24px;border:1px solid #344252;background:#192430;border-radius:12px;margin:20px 0}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.grid section{margin:0}label{display:block;margin:14px 0 5px}input,textarea,select,button{font:inherit;color:inherit;border-radius:6px;border:1px solid #536174;padding:9px 11px;background:#101821}input,textarea,select{width:100%}textarea{resize:vertical;min-height:70px}button{cursor:pointer;background:#26394d}button.primary{background:#157ba2;border-color:#2398c3}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:180px}.checks label{display:flex;align-items:center;gap:8px}.checks input{width:auto}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}#notice{min-height:24px;white-space:pre-wrap;color:#99dcf3}dl{margin:0}dt{color:#a9b7c7;margin-top:12px}dd{margin:3px 0;overflow-wrap:anywhere}#checkresult{white-space:pre-wrap;margin-top:16px}.hint{font-size:13px;color:#a9b7c7;margin-top:4px}#workspace[hidden]{display:none}@media(max-width:720px){.grid,.split{grid-template-columns:1fr}main{margin-top:24px}section{padding:18px}}
</style></head>
<body><main><h1>Steam 家庭库管理</h1><div class="muted">设置扫描间隔与推送目标，查看监控和登录状态。</div>
<section id="signin"><label for="token">管理密钥</label><div class="row"><input id="token" type="password" autocomplete="off" placeholder="填写 web-token.txt 或配置中的密钥"><button id="connect" class="primary">连接</button></div><p class="hint">密钥只保留在本页面内存中；刷新页面后需重新填写。</p></section>
<p id="notice" role="status"></p>
<div id="workspace" class="grid" hidden><section><h2>监控设置</h2><form id="settings">
<div class="split"><div><label for="poll">请求间隔（秒）</label><input id="poll" type="number" min="60" max="86400" required></div><div><label for="jitter">随机额外等待（秒）</label><input id="jitter" type="number" min="0" max="300" required></div></div>
<div class="split"><div><label for="language">游戏名称语言</label><input id="language" maxlength="32" required></div><div><label for="missing">连续缺失确认次数</label><input id="missing" type="number" min="1" max="10" required></div></div>
<label for="groups">推送群聊</label><textarea id="groups" placeholder="每行一个 QQ 群号，也可用逗号分隔"></textarea>
<label for="users">推送个人</label><textarea id="users" placeholder="每行一个 QQ 号，也可用逗号分隔"></textarea>
<label for="botid">发送消息的 Bot QQ 号（可选）</label><input id="botid" inputmode="numeric" placeholder="留空使用首次启用的 Bot">
<label for="aliases">成员别名（JSON）</label><textarea id="aliases" spellcheck="false" placeholder='{"76561198000000001":"家庭成员A"}'></textarea>
<div class="split"><div><label for="maximum">每轮每个目标最多推送</label><input id="maximum" type="number" min="1" max="50" required></div><div><label for="retry">推送失败重试间隔（秒）</label><input id="retry" type="number" min="10" max="3600" required></div></div>
<div class="checks"><label><input id="images" type="checkbox">附带游戏图片</label><label><input id="history" type="checkbox">新目标补取已记录的历史事件</label></div>
<p class="hint">保存后立即生效并保留到下次重启。已有目标的确认进度不会重置，限流等待也会保留。</p><button class="primary" type="submit">保存设置</button>
</form></section><section><h2>运行状态</h2><dl id="status"></dl><p class="hint" id="activationhint"></p><div class="row"><button id="check">检查配置</button><button id="refresh">刷新状态</button><button id="stop">停止监控</button><button id="resume">恢复监控</button></div><div id="checkresult" role="status"></div><p class="hint">首次启用请由超级用户向 Bot 发送 steam启动。重新登录前先停止监控，登录完成后恢复。</p></section></div>
<script>
const el=id=>document.getElementById(id);let token='',busy=false;
const ids=value=>value.split(/[\s,，]+/).filter(Boolean);
async function api(path,method='GET',body){const response=await fetch(path,{method,headers:{Authorization:`Bearer ${token}`,...(body===undefined?{}:{'Content-Type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});const data=await response.json();if(!response.ok&&!(path==='/api/check'&&response.status===409)){throw new Error(data.errors?data.errors.map(x=>typeof x==='string'?x:`${x.field}: ${x.message}`).join('\n'):data.message||'请求失败');}return data;}
function fill(c){el('poll').value=c.steam_family_poll_seconds;el('jitter').value=c.steam_family_jitter_seconds;el('language').value=c.steam_family_language;el('missing').value=c.steam_family_missing_confirmations;el('groups').value=c.steam_family_push_groups.join('\n');el('users').value=c.steam_family_push_users.join('\n');el('botid').value=c.steam_family_bot_id||'';el('aliases').value=JSON.stringify(c.steam_family_member_aliases,null,2);el('maximum').value=c.steam_family_max_push_per_tick;el('retry').value=c.steam_family_push_retry_seconds;el('images').checked=c.steam_family_send_images;el('history').checked=c.steam_family_replay_history;}
function render(s){const auth={stopped:'监控已停止',not_logged_in:'尚未登录',loaded:'凭据已加载',authenticated:'登录正常',needs_login:'需要重新登录',temporarily_unavailable:'暂时不可用'};el('status').replaceChildren();const rows=[['监控',s.enabled?'已启用':'已停止'],['Bot',s.bot_connected?'已连接':'未连接'],['Steam 登录',auth[s.auth_state]||s.auth_state],['家庭库基线',s.baseline_ready?'已建立':'未建立或监控已停止'],['推送目标',`${s.groups} 个群聊，${s.users} 个个人`],['上次成功扫描',s.last_success_at||'暂无'],['下次检查（UTC）',s.next_check_at||'暂无'],['最近错误',s.startup_error||s.web_error||(s.last_error?s.last_error.message:'无')]];for(const [name,value]of rows){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=name;dd.textContent=value;el('status').append(dt,dd);}el('resume').disabled=!s.activated||s.enabled;el('stop').disabled=!s.enabled;el('activationhint').textContent=s.activated?'已完成首次启用，重启会恢复已保存的启用或停止状态。':'等待首次命令启用。';}
async function refresh(){render((await api('/api/status')).status);}
async function action(fn){if(busy)return;busy=true;try{await fn();}catch(error){el('notice').textContent=error.message;}finally{busy=false;}}
el('connect').onclick=()=>action(async()=>{token=el('token').value.trim();const data=await api('/api/config');fill(data.config);await refresh();el('workspace').hidden=false;el('notice').textContent='已连接。';el('token').value='';});
el('settings').onsubmit=event=>{event.preventDefault();action(async()=>{const body={steam_family_poll_seconds:Number(el('poll').value),steam_family_jitter_seconds:Number(el('jitter').value),steam_family_language:el('language').value.trim(),steam_family_missing_confirmations:Number(el('missing').value),steam_family_push_groups:ids(el('groups').value),steam_family_push_users:ids(el('users').value),steam_family_bot_id:el('botid').value.trim()||null,steam_family_member_aliases:JSON.parse(el('aliases').value||'{}'),steam_family_max_push_per_tick:Number(el('maximum').value),steam_family_push_retry_seconds:Number(el('retry').value),steam_family_send_images:el('images').checked,steam_family_replay_history:el('history').checked};fill((await api('/api/config','PATCH',body)).config);el('checkresult').textContent='';await refresh();el('notice').textContent='设置已保存并生效。';});};
el('refresh').onclick=()=>action(refresh);el('check').onclick=()=>action(async()=>{const result=await api('/api/check','POST',{});el('checkresult').textContent=[result.ok?'配置检查通过。':'配置检查未通过。',...(result.errors||[]),...(result.warnings||[])].join('\n');});for(const command of ['stop','resume'])el(command).onclick=()=>action(async()=>{await api(`/api/${command}`,'POST',{});await refresh();el('notice').textContent=command==='stop'?'监控已停止，数据锁已释放。':'监控已恢复。';});
</script></main></body></html>
